name: Executar Testes Cypress

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Iniciar servidor
        run: |
          node servidor.js &
          echo "Servidor iniciado, aguardando..."
          sleep 30

      - name: Verificar se servidor está respondendo
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:3000/api/jogos > /dev/null; then
              echo "Servidor está respondendo!"
              break
            fi
            echo "Aguardando servidor... tentativa $i de 10"
            sleep 3
          done

      - name: Executar testes do Cypress
        uses: cypress-io/github-action@v6
        with:
          command: npx cypress run
          start: ""
          wait-on: false
